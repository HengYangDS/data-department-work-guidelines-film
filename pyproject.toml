[project]
name = "ddwg-film"
dynamic = ["version"]
description = "Rebuild the DDWG introduction films from their sources with the filmkit engine"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["filmkit"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

# The repository is the film, not a package: uv installs its dependencies without building it.
# Resolve stable releases only, as uv.lock records; `uv run --locked` refuses a lock that was
# resolved in another prerelease mode.
[tool.uv]
package = false
prerelease = "disallow"
# The repair keeps the speech engine that narrated the accepted v1.1.0 editions, so every thought it
# leaves unchanged reproduces its recording from its seed; filmkit 0.19.0 itself requires mlx-audio
# 0.6.4, which resolves MLX 0.32.4, and those change some of the takes. The next full production
# moves them.
override-dependencies = ["mlx-audio==0.5.8", "mlx==0.32.3", "mlx-metal==0.32.3"]

# The film engine, at the release whose tag the lock pins to its commit. The film needs 0.19.0 or
# later, which renders each edition with and without its captions, keeps the film on the screen
# across the player's switches, keeps declared caption terms whole, gates a finished stage off
# centre and a mark that jumps or pops at a stage cut, names the author once in each film's
# metadata, names its version, compares every frame of an edition's two pictures and judges the
# review by the owner's 信、达、雅.
[tool.uv.sources]
filmkit = { git = "https://github.com/HengYangDS/filmkit", tag = "v0.19.0" }

# VERSION is the only version source, as ETHOS requires of a repository that tags releases.
[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>\\S+)$"

[dependency-groups]
# fontTools measures the picture's text for the engine's picture tools, which filmkit 0.18.0 imports
# but declares only for its own development, as the sibling films also do.
dev = [
  "coverage==7.17.0",
  "fonttools==4.68.0",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-reportlog==1.0.0",
]
