[project]
name = "ddwg-film"
dynamic = ["version"]
description = "Rebuild the DDWG introduction films from their sources with the filmkit engine"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["filmkit"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

# The repository is the film, not a package: uv installs its dependencies without building it.
# Resolve stable releases only, as uv.lock records; `uv run --locked` refuses a lock that was
# resolved in another prerelease mode.
[tool.uv]
package = false
prerelease = "disallow"
# The repair keeps the speech engine that narrated the accepted v1.1.0 editions, so every thought it
# leaves unchanged reproduces its recording from its seed; filmkit 0.5.0 itself declares mlx-audio
# 0.6.4 and MLX 0.32.4, which change some of those takes. The next full production moves them.
override-dependencies = ["mlx-audio==0.5.8", "mlx==0.32.3", "mlx-metal==0.32.3"]

# The film engine, at the release whose tag the lock pins to its commit. The film needs 0.3.0 or
# later, which checks the concept contract and the declared readings before any narration.
[tool.uv.sources]
filmkit = { git = "https://github.com/HengYangDS/filmkit", tag = "v0.5.0" }

# VERSION is the only version source, as ETHOS requires of a repository that tags releases.
[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>\\S+)$"

[dependency-groups]
dev = ["coverage==7.17.0", "pytest==9.2.0", "pytest-cov==7.1.0", "pytest-reportlog==1.0.0"]
