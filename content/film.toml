# The film this repository builds. The filmkit engine takes every film-specific value from this
# declaration and the files it names; each edition's script declares its title, author,
# language, duration, frame rate and chapters. Paths are below the repository root.

# The prefix of every delivered file.
slug = "ddwg"
# The folder in ~/Documents that receives the delivery.
documents_folder = "ddwg-introduction-film"
# The page that leads to each edition's player.
entry = "content/index.html"
# The commit and digests of the canonical documents the films explain.
source_manifest = "content/source-manifest.json"
# What each concept the films name means in those documents, and each edition's words for it.
concepts = "content/concepts.toml"

# Each edition's folder of script and cast, its 16:9 cover, and the summary its player shows.
[editions.zh]
sources = "content"
summary = "从判断、数据与交付，讲到人与人工智能的协作、沟通和持续改进。片中的例子都是示意，不代表指南已经部署或被采用。"
cover = "assets/cover/ddwg-cover.png"

[editions.en]
sources = "content/en"
summary = "From judgment, data and delivery to human–AI collaboration, communication and continuous improvement. Its examples are illustrative, and the film does not claim the guidelines are deployed or adopted."
cover = "assets/cover/ddwg-cover-en.png"
# A term that reads as one name stays on one caption line, as do a verb and the object it
# takes, and a modifier and the noun it qualifies.
caption_terms = [
  "source of truth",
  "sources of truth",
  "decision owner",
  "task lead",
  "release owner",
  "work cycle",
  "permission or compliance",
  "resource limits",
  "publication time",
  "price snapshots",
  "goes back to the member",
  "make up for",
  "fabricated selectively hidden or unverified facts",
  "agent output",
  "standing in for",
  "fact authorization or responsibility",
  "data department work guidelines",
  "operational delivery",
  "the problem scope or completion condition",
  "authority to act",
  "authority about facts",
  "fact source",
  "human–AI collaboration",
  "better able to recognize",
  "responsibility for consequences",
  "but verification finds the data wrong",
  "a correlation presented as a cause",
  "the product owner identifies",
  "dependent consumers",
  "and governance confirms",
  "earlier and revised price snapshots",
  "risks like these",
  "something others can safely rely on",
]

# The fonts the picture stages below fonts/, in this order: Noto Sans CJK SC for any text with a
# Chinese character, and IBM Plex Sans for Latin-only text.
[picture]
fonts = [
  "assets/fonts/NotoSansCJKsc-Regular.otf",
  "assets/fonts/NotoSansCJKsc-Bold.otf",
  "assets/fonts/IBMPlexSans-Regular.ttf",
  "assets/fonts/IBMPlexSans-Bold.ttf",
]

# Wrapped labels kept against the wrapping rules, each a deliberate phrase break.
[[picture.wrapping.exceptions]]
edition = "en"
lines = ["Examine", "the reasoning"]
reason = "28.1's middle action stands verb over object; on one line it would stand about 6 px from the next station's name, the widest of the row."

[[picture.wrapping.exceptions]]
edition = "en"
lines = [
  "Production, funds, sensitive data,",
  "security or compliance, deletion or overwrite,",
  "external commitments or irreversible consequences",
]
reason = "04.7's high-risk work breaks only between its conditions, so 'security or compliance' and 'deletion or overwrite' each stay whole; no break of the seven keeps an even block in the work column, and set as a list the ladder would show eighteen names."

# The colours of each edition's player page: its ground, text, quieter text, rules and borders,
# and the accent of a chosen or focused control.
[player]
background = "#0F1519"
text = "#ECE8DF"
muted = "#9BA8B1"
line = "#34424E"
accent = "#7DB7D8"

[review]
# The reviewer prompt: a str.format template that each round fills for each edition.
prompt = "content/review/prompt.md"
# The listening plan's analyst readings: context readings of Chinese words, and the English
# heteronyms with the part of speech of each occurrence, keyed by segment and offset in the script.
readings = "content/review/readings.json"
# The verifier's floor: the overall score and every dimension at least this.
overall_minimum = 95
dimension_minimum = 95
# The voice's clarity floor per edition, which the review measurement checks on every segment.
clarity_minimum_db = { zh = 18.0, en = 17.0 }

# The scored dimensions in record order, with what each one asks reviewers to judge.
[review.dimensions]
subject_and_faithfulness = """\
  DDWG remains the subject; all seven documents substantively covered with conditions and \
  boundaries; examples illuminate rules; Human/Agent responsibility and role combinations \
  accurate."""
concept_fidelity = """\
  each concept the film names keeps its source meaning as the concept contract quotes it, in \
  the edition's one rendering through narration, captions, titles and picture; no rendering \
  narrows, personifies, substitutes or literally translates a concept."""
narrative_and_clarity = """\
  the real problem before the response; terms defined before use; connected argument; clear \
  chapter boundaries; ending returns to the opening; the edition stands alone."""
language_quality = """\
  faithful, clear and elegant (信、达、雅): plain spoken language a person would say, with no \
  staged contrasts, one-line closers, forced triads, run-ups, translationese or stock phrases; \
  the Chinese reads as spoken Chinese, not a translation of the English."""
voice_quality = """\
  a clear, warm and present voice, neither hoarse, breathy, strained, muffled nor metallic: \
  cepstral peak prominence over the loud speech frames at least 18 dB in Chinese and 17 dB \
  in English, near the clear reference narrations; one voice identity across both editions."""
narration_performance = """\
  delivery natural, neither sleepy, rushed nor theatrical; distinct thought pauses, paragraph \
  boundaries and audible phrase tails, with no swallowed ending; continuous and idiomatic \
  phrasing."""
pronunciation = """\
  tones and polyphones in context, English vowels and stress, and each name's declared spoken \
  form; one consistent term for each concept."""
visual_explanation_and_motion = """\
  pictures explain relationships, operations, comparisons and consequences as narration \
  develops; restrained but varied, intentional 2D motion; text supports the visual argument."""
composition_and_typography = """\
  the text on screen aligned, tidy and beautiful (文字的对齐、工整和美感): alignment guides, \
  hierarchy, margins, density and modest single-line captions; the names of a row on one \
  baseline, identical items at one pitch, each name on its own mark from its first word, \
  compositions centred, cards padded evenly, balanced line breaks; collisions or clipping with \
  timecodes."""
visual_aesthetics_and_color = """\
  an elegant, coherent whole with taste: a calm ground without a colour cast, accents that \
  carry meaning only, every text at least 4.5:1 against the ground, one palette from cover to \
  credits."""
sound_picture_continuity = """\
  speech, captions, diagrams and scene changes synchronized; complete thoughts survive the \
  edit; image stays purposeful through transitions and pauses."""
credits_and_deliverable_craft = """\
  the film opens on its title card and closes on its signature; covers match the title card; \
  Yang HENG metadata; subtitles and transcript match the speech; chapters; player; a runtime \
  that is a whole multiple of five minutes; opening, ending, covers and entry form one \
  edition."""

# The review's three levels, the owner's 信、达、雅, by which a first-time viewer judges the whole film: each asks one
# thing of the film and holds some of the dimensions, every dimension in one level. A review passes only when each
# level does, with every dimension it holds at the floor and no material finding in it.
[review.levels."信"]
asks = """\\
  faithful: every statement says what its cited source says, with its conditions, modality and scope; each concept \\
  keeps its contract rendering and one name, and the Chinese carries a Latin term's number in the noun's own clause; \\
  names and readings are said as declared; both editions say the same things in the same order, and the picture names \\
  what the voice says, in its words."""
dimensions = ["subject_and_faithfulness", "concept_fidelity", "pronunciation"]

[review.levels."达"]
asks = """\\
  conveyed: a newcomer understands each sentence the first time it is heard, with a clear subject, familiar \\
  collocations and every term explained where it first appears; the argument moves step by step and the ending \\
  returns to the opening; the voice speaks in thought groups, with no pause inside a phrase and no swallowed ending; \\
  the picture shows what is said as it is said; the player, transcript and files work as a viewer expects."""
dimensions = [
  "narrative_and_clarity",
  "narration_performance",
  "sound_picture_continuity",
  "credits_and_deliverable_craft",
]

[review.levels."雅"]
asks = """\\
  graceful: plain spoken words a fluent speaker would say, Chinese that is not a translation of the English, and no \\
  machine tells; a clear, warm voice; every movement eases in and out, and nothing halts, sets off, pops, jumps or \\
  races outside a stage cut; text aligned, even and tidy, frames balanced, one palette."""
dimensions = [
  "language_quality",
  "voice_quality",
  "visual_explanation_and_motion",
  "composition_and_typography",
  "visual_aesthetics_and_color",
]
